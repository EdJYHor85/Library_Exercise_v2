# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Runs a set of commands using the runners shell
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
                
      # Run pytest tests
      - name: Run pytest tests
        run: |
            python -m pytest "03 testing" \-v
          

  # ==================================================
  # BUILD JOB
  # Only runs if the test job succeeds
  # ==================================================

  build:
    name: Building Docker Image
    needs: test
    runs-on: ubuntu-latest

steps:
- uses: actions/checkout@v4

- name: Build and save image
  run: |
    docker build -f docker/Dockerfile -t $IMAGE_NAME:${{ github.sha }} .
    docker save $IMAGE_NAME:${{ github.sha }} -o $IMAGE_NAME.tar

- name: Upload image artifact
  uses: actions/upload-artifact@v7
  with:
    name: ${{ env.IMAGE_NAME }}-${{ github.sha }}
    path: ${{ env.IMAGE_NAME }}.tar